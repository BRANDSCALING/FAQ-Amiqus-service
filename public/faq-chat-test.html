<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQ chat — local test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.25rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .meta-row { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.35rem; }
    .meta-row strong { color: var(--text); }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
    textarea {
      width: 100%;
      min-height: 6rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0c1017;
      color: var(--text);
      font: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.65rem; flex-wrap: wrap; }
    button {
      font: inherit;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #243044;
      color: var(--text);
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: #2563eb;
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8125rem;
      background: #0c1017;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      max-height: 22rem;
      overflow: auto;
    }
    .response-text { font-size: 0.9375rem; margin-bottom: 0.75rem; }
    .reply-body p {
      margin: 0 0 0.75rem;
      line-height: 1.55;
    }
    .reply-body p:last-child { margin-bottom: 0; }
    .reply-body strong { color: #f1f5f9; font-weight: 600; }
    .reply-body ol.reply-ol {
      margin: 0.5rem 0 0.85rem 1.35rem;
      padding-left: 0.35rem;
      list-style: decimal;
    }
    .reply-body ul.reply-ul {
      margin: 0.5rem 0 0.85rem 1.1rem;
      padding-left: 0.35rem;
      list-style: disc;
    }
    .pill {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      margin-right: 0.35rem;
      margin-bottom: 0.35rem;
      background: #243044;
      border: 1px solid var(--border);
    }
    .pill.oos { border-color: var(--warn); color: var(--warn); }
    .pill.ok { border-color: var(--ok); color: var(--ok); }
    .err { color: #f87171; font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">FAQ chat — local test</h1>
    <p class="sub">Uses this server’s <code>/faq-chat</code> API (same origin — no CORS issues).</p>

    <div class="panel" id="status-panel">
      <div class="meta-row"><strong>Health</strong> <span id="health">Loading…</span></div>
      <div class="meta-row"><strong>Meta</strong> <span id="meta-line">—</span></div>
    </div>

    <div class="panel">
      <label for="msg">Message</label>
      <textarea id="msg" placeholder="Ask a UCWS Partner FAQ question…"></textarea>
      <div class="actions">
        <button type="button" class="primary" id="send">Send</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </div>

    <div class="panel" id="out-panel" hidden>
      <div id="pills"></div>
      <div class="response-text reply-body" id="reply"></div>
      <label style="margin-top:0.75rem">Raw JSON</label>
      <pre id="raw"></pre>
    </div>
    <p class="err" id="err" hidden></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    /** Escape then light formatting: paragraphs, line breaks, **bold**, simple bullet lines. */
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatFaqReply(raw) {
      let t = escapeHtml(String(raw || ''));
      t = t.replace(/\r\n/g, '\n');
      // Model often glues "... include: 1. **" without a newline — force breaks before numbered list runs
      t = t.replace(/([.!:])\s*(\d+\.\s+\*\*)/g, '$1\n\n$2');
      t = t.replace(/([.!:])\s*(\d+\.\s+[A-Za-z])/g, '$1\n\n$2');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      const lines = t.split('\n');
      const out = [];
      let para = [];
      let list = [];

      const isListLine = (ln) => /^\s*(?:[-*]|\d+\.)\s+/.test(ln);

      function flushPara() {
        if (!para.length) return;
        const body = para.map((x) => x.trim()).join('<br />');
        if (body) out.push('<p class="reply-p">' + body + '</p>');
        para = [];
      }
      function flushList() {
        if (!list.length) return;
        const numbered = /^\s*\d+\./.test(list[0]);
        const tag = numbered ? 'ol' : 'ul';
        const cls = numbered ? 'reply-ol' : 'reply-ul';
        const items = list
          .map((ln) => ln.replace(/^\s*(?:[-*]|\d+\.)\s+/, '').trim())
          .filter(Boolean)
          .map((it) => '<li>' + it + '</li>')
          .join('');
        out.push('<' + tag + ' class="' + cls + '">' + items + '</' + tag + '>');
        list = [];
      }

      for (const line of lines) {
        const trimmedEnd = line.trimEnd();
        if (!trimmedEnd.trim()) {
          flushList();
          flushPara();
          continue;
        }
        if (isListLine(trimmedEnd)) {
          flushPara();
          list.push(trimmedEnd);
        } else {
          flushList();
          para.push(trimmedEnd.trim());
        }
      }
      flushList();
      flushPara();
      return out.length ? out.join('') : '<p class="reply-p">(empty)</p>';
    }

    async function loadMeta() {
      try {
        const [h, m] = await Promise.all([
          fetch('/faq-chat/health').then((r) => r.json()),
          fetch('/faq-chat/meta').then((r) => r.json()),
        ]);
        const ok = h.ok ? 'ok' : 'not ok';
        const rag = h.ragEmbeddingsReady ? 'RAG on' : 'RAG off (lexical fallback)';
        $('health').textContent =
          `${ok} · ${h.faqCount ?? '?'} sections · v${h.knowledgeVersion ?? '?'} · ${rag}`;
        $('meta-line').textContent = `${m.faqCount} sections · ${(m.categories || []).length} categories`;
        $('title').textContent = m.chatbotTitle || 'FAQ chat — local test';
        document.title = (m.chatbotTitle || 'FAQ') + ' — test';
      } catch (e) {
        $('health').textContent = 'Failed to load (is the backend running?)';
      }
    }

    function showError(msg) {
      const el = $('err');
      el.textContent = msg;
      el.hidden = !msg;
    }

    $('send').addEventListener('click', async () => {
      const text = $('msg').value.trim();
      if (!text) {
        showError('Enter a message.');
        return;
      }
      showError('');
      $('send').disabled = true;
      $('out-panel').hidden = true;
      try {
        const res = await fetch('/faq-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, clientRequestId: 'faq-test-ui' }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(res.status + ' ' + (body.message || body.error || JSON.stringify(body)));
          return;
        }
        $('out-panel').hidden = false;
        $('reply').innerHTML = formatFaqReply(body.response);
        $('raw').textContent = JSON.stringify(body, null, 2);
        const pills = $('pills');
        pills.innerHTML = '';
        const oos = document.createElement('span');
        oos.className = 'pill oos';
        oos.textContent = body.outOfScope ? 'out of scope' : 'in scope';
        pills.appendChild(oos);
        if (body.fromCache) {
          const c = document.createElement('span');
          c.className = 'pill ok';
          c.textContent = 'from cache';
          pills.appendChild(c);
        }
        if (Array.isArray(body.citedFaqIds) && body.citedFaqIds.length) {
          body.citedFaqIds.forEach((id) => {
            const p = document.createElement('span');
            p.className = 'pill';
            p.textContent = id;
            pills.appendChild(p);
          });
        }
      } catch (e) {
        showError(String(e.message || e));
      } finally {
        $('send').disabled = false;
      }
    });

    $('clear').addEventListener('click', () => {
      $('msg').value = '';
      $('out-panel').hidden = true;
      showError('');
    });

    $('msg').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        $('send').click();
      }
    });

    loadMeta();
  </script>
</body>
</html>
